
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090A0F">
  <meta name="description" content="Oliveira Tech — acesso à plataforma.">

  <title>Login | Oliveira Tech</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top right, #13243a 0%, transparent 45%),
        #090A0F;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      animation: entrance 1.5s ease both;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand b {
      color: #8ebef5;
    }

    .brand-logo {
      display: block;
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex-shrink: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      border-radius: 8px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 34px 28px;
      border: 1px solid rgba(142, 190, 245, 0.17);
      border-radius: 20px;
      background: rgba(16, 20, 29, 0.94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #8ebef5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 29px;
      letter-spacing: -0.8px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #9ca8b8;
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid #303949;
      border-radius: 10px;
      outline: none;
      background: #0c111a;
      color: #fff;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      border-color: #8ebef5;
      box-shadow: 0 0 0 3px rgba(142, 190, 245, 0.1);
    }

    input::placeholder {
      color: #697586;
    }

    .login-button {
      width: 100%;
      min-height: 49px;
      margin-top: 5px;
      border: 0;
      border-radius: 10px;
      background: #8ebef5;
      color: #09111c;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .login-button:hover {
      background: #b3d4fb;
      transform: translateY(-1px);
    }

    .login-button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    #loginMessage {
      min-height: 18px;
      margin: 16px 0 0;
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .footer {
      margin-top: 26px;
      color: #667085;
      font-size: 12px;
      text-align: center;
    }

    @keyframes entrance {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 24px 16px;
      }

      .login-card {
        padding: 28px 22px;
      }

      .brand {
        font-size: 18px;
      }

      h1 {
        font-size: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <a href="index.html" class="brand">
      <img
        src="assets/8BEBF5CA-6F71-47BF-917F-C75156579FE4.png"
        alt="Logo Oliveira Tech"
        class="brand-logo"
      >
      <span>OLIVEIRA <b>TECH</b></span>
    </a>

    <section class="login-card">
      <p class="eyebrow">Plataforma exclusiva</p>

      <h1>Bem-vindo de volta.</h1>

      <p class="subtitle">
        Entre na sua conta para acessar o ambiente da Oliveira Tech.
      </p>

      <form id="loginForm">
        <div class="field">
          <label for="userType">Tipo de acesso</label>
          <select id="userType" name="userType" required>
            <option value="client">Área do cliente</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="loginButton" class="login-button">
          Entrar na plataforma
        </button>

        <p id="loginMessage" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer class="footer">
      © 2026 Oliveira Tech. Todos os direitos reservados.
    </footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
